name: Shift-Left (fork gates)

# Fork addition (docs/SHIFT_LEFT.md): the acceptance tests run BEFORE the
# firmware build in the existing CI, so a language/font/format/cache
# regression fails fast on the host instead of on device.
on:
  push:
    branches: [develop]
  pull_request:

permissions:
  contents: read

jobs:
  acceptance-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install fonttools (font specimen checks)
        run: pip install fonttools
      - name: Language / font / confirmation acceptance tests
        run: |
          python3 test/test_supported_languages.py
          python3 test/test_sc_supplement.py
          python3 test/test_kr_supplement.py
          python3 test/test_confirmation_translations.py
          python3 test/test_translation_spacing.py
      - name: i18n generator runs clean for exactly 5 languages
        run: |
          python3 scripts/gen_i18n.py lib/I18n/translations lib/I18n/ | tee /tmp/gen.log
          grep -q "Languages: 5" /tmp/gen.log

  host-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build zlib1g-dev
      - name: Configure
        run: cmake -S test -B build/test -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/test
      - name: Run tests (includes MarkdownToHtml, PdfText, FileCache, SupportedFormats)
        run: ctest --test-dir build/test --output-on-failure -j
